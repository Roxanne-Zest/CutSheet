[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19.0 || >=22.12.0 — Netlify's default is older and
  # will fail the build. This matches the version used for development.
  NODE_VERSION = "22"

# No functions directory: v1 is entirely client-side. Photos and projects live
# in the browser's IndexedDB and the PDF is built in the browser with pdf-lib,
# so nothing is uploaded anywhere. Add [functions] here if that ever changes.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints filenames, so built assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
